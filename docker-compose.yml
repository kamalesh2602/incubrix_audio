services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: incubrix-audio:latest
    container_name: incubrix_audio_engine
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - PROVIDER_TYPE=mock
      - STORAGE_BACKEND=local
      - STORAGE_DIR=/app/storage
    volumes:
      - audio_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # S3-compatible object storage service (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: incubrix_minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # One-command test service: runs full test suite in container
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_test_runner
    environment:
      - APP_ENV=test
      - PROVIDER_TYPE=mock
      - STORAGE_BACKEND=local
      - LOG_LEVEL=WARNING
    command: ["pytest", "-v"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  audio_data:
  minio_data:
