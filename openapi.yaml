openapi: 3.1.0
info:
  title: IncuBrix Audio Engine
  version: 0.2.0
paths:
  /api/v1/music/jobs:
    post:
      tags:
      - music
      summary: Create background music generation job
      description: Accepts music generation parameters and queues a background synthesis
        job.
      operationId: create_music_job_api_v1_music_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicJobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audio/upload:
    post:
      tags:
      - music
      summary: Upload audio file (narration or reference)
      description: Uploads an audio file (.wav, .mp3, .flac, .ogg) for use in music
        generation requests.
      operationId: upload_audio_file_api_v1_audio_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_audio_file_api_v1_audio_upload_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get job status and results
      description: Returns current status (queued, running, succeeded, failed), progress,
        and artifact links.
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/artifacts/{filename}:
    get:
      tags:
      - jobs
      summary: Download generated artifact
      description: Downloads audio files (.wav) or manifest (.json) produced by a
        job.
      operationId: get_job_artifact_api_v1_jobs__job_id__artifacts__filename__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/download:
    get:
      tags:
      - jobs
      summary: Download complete job archive as ZIP
      description: Downloads a ZIP archive containing mix.wav, mix.mp3 (if present),
        all separated stems under stems/, and music_manifest.json.
      operationId: download_job_archive_api_v1_jobs__job_id__download_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: ZIP archive containing generated mix, stems, and manifest
          content:
            application/json:
              schema: {}
            application/zip: {}
        '404':
          description: Job or artifact not found
        '409':
          description: Job is still in progress (queued/running) or failed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health Check
      description: Returns liveness probe status.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      summary: Readiness Check
      description: Returns readiness status.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AudioUploadResponse:
      properties:
        upload_id:
          type: string
          title: Upload Id
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        size_bytes:
          type: integer
          title: Size Bytes
        url:
          type: string
          title: Url
        message:
          type: string
          title: Message
          default: Audio file uploaded successfully
      type: object
      required:
      - upload_id
      - filename
      - content_type
      - size_bytes
      - url
      title: AudioUploadResponse
    Body_upload_audio_file_api_v1_audio_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Audio file to upload (.wav, .mp3, .flac, .ogg)
      type: object
      required:
      - file
      title: Body_upload_audio_file_api_v1_audio_upload_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobResultSchema:
      properties:
        audio_url:
          type: string
          title: Audio Url
        stems:
          additionalProperties:
            type: string
          type: object
          title: Stems
        manifest_url:
          type: string
          title: Manifest Url
        duration_s:
          type: number
          title: Duration S
        sample_rate:
          type: integer
          title: Sample Rate
        channels:
          type: integer
          title: Channels
          default: 1
        format:
          type: string
          title: Format
          default: wav
        stem_gains:
          additionalProperties:
            type: number
          type: object
          title: Stem Gains
      type: object
      required:
      - audio_url
      - stems
      - manifest_url
      - duration_s
      - sample_rate
      - stem_gains
      title: JobResultSchema
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Progress
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        result:
          anyOf:
          - $ref: '#/components/schemas/JobResultSchema'
          - type: 'null'
      type: object
      required:
      - job_id
      - status
      - progress
      - created_at
      title: JobStatusResponse
    MusicJobRequest:
      properties:
        prompt:
          type: string
          maxLength: 1000
          minLength: 1
          title: Prompt
          description: Text prompt describing the desired background music
        duration_s:
          type: number
          maximum: 300.0
          minimum: 5.0
          title: Duration S
          description: Duration in seconds (5-300 seconds)
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/SectionSchema'
            type: array
          - type: 'null'
          title: Sections
          description: Optional timeline section breakdown
        tempo_bpm:
          anyOf:
          - type: integer
            maximum: 300.0
            minimum: 30.0
          - type: 'null'
          title: Tempo Bpm
          description: Optional tempo in BPM (30-300)
        key:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Key
          description: Optional musical key (e.g. 'C major', 'A minor')
        loopable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Loopable
          description: Whether the audio should be seamlessly loopable
          default: false
        narration_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Narration Url
          description: Optional URL to narration voiceover audio
        seed:
          anyOf:
          - type: integer
            maximum: 4294967295.0
            minimum: 0.0
          - type: 'null'
          title: Seed
          description: Optional seed for deterministic generation
        output:
          anyOf:
          - $ref: '#/components/schemas/OutputSchema'
          - type: 'null'
          description: Output audio configuration
      type: object
      required:
      - prompt
      - duration_s
      title: MusicJobRequest
    MusicJobResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
          default: queued
        created_at:
          type: string
          format: date-time
          title: Created At
        message:
          type: string
          title: Message
          default: Job accepted and queued for processing
        job_url:
          type: string
          title: Job Url
      type: object
      required:
      - job_id
      - created_at
      - job_url
      title: MusicJobResponse
    OutputSchema:
      properties:
        sample_rate:
          type: integer
          title: Sample Rate
          description: 'Audio sample rate (supported: 22050, 44100, 48000)'
          default: 44100
        target_lufs:
          type: number
          maximum: -6.0
          minimum: -30.0
          title: Target Lufs
          description: Target integrated loudness in LUFS (-30 to -6)
          default: -14.0
        formats:
          items:
            type: string
          type: array
          title: Formats
          description: 'Audio export formats (supported: ''wav'')'
      type: object
      title: OutputSchema
    SectionSchema:
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
          description: Section name or role, e.g. 'intro', 'verse'
        start_s:
          type: number
          minimum: 0.0
          title: Start S
          description: Start timestamp in seconds (>= 0)
        end_s:
          type: number
          exclusiveMinimum: 0.0
          title: End S
          description: End timestamp in seconds (> start_s)
      type: object
      required:
      - name
      - start_s
      - end_s
      title: SectionSchema
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
